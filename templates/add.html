<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>添加监控项 · sitewatch</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  .wrap { max-width: 640px; }
  .card { padding: var(--s5); }
  .actions {
    display: flex;
    gap: var(--s3);
    align-items: center;
  }
  .cancel { color: var(--text-3); font-size: 13px; }
  .cancel:hover { color: var(--text-2); text-decoration: none; }
  .row { display: flex; gap: var(--s3); }
  .row .field { flex: 1; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">&larr; 返回列表</a>
  <h1>添加监控项</h1>

  <div class="tip" style="margin: var(--s4) 0 var(--s5)">
    <b>下面两个选填项，二选一就够了：</b><br>
    抓普通网页 → 填 <code>选择器</code>；抓数据接口 → 填 <code>字段名</code>。<br>
    不确定填哪个？两个都留空，先看能抓到什么，再回来改。
  </div>

  <div class="card">
    {% if error %}<div class="err">{{ error }}</div>{% endif %}

    <form method="post" action="/add">
      <div class="field">
        <label>名字<span class="req">*</span></label>
        <input type="text" name="name" value="{{ form.get('name','') }}"
               placeholder="自己起一个，比如 fz-weather" autofocus>
        <div class="hint">用来区分不同站点，不能重复。</div>
      </div>

      <div class="field">
        <label>网址<span class="req">*</span></label>
        <input type="text" name="url" value="{{ form.get('url','') }}"
               placeholder="https://...">
        <div class="hint">完整的 URL，要以 <code>http://</code> 或 <code>https://</code> 开头。</div>
      </div>

      <div class="field">
        <label>选择器<span class="opt">选填，抓网页时用</span></label>
        <input type="text" name="selector" value="{{ form.get('selector','') }}"
               placeholder="比如 ul.t li">
        <div class="hint">CSS 选择器，只抓页面上这部分内容。留空则抓整页正文（导航、页脚都会混进来）。</div>
      </div>

      <div class="field">
        <label>字段名<span class="opt">选填，抓接口时用</span></label>
        <input type="text" name="json_keys" value="{{ form.get('json_keys','') }}"
               placeholder="比如 code,title,bvid">
        <div class="hint">逗号分隔。只保留这些字段，噪声会小很多。留空则保存整个 JSON。</div>
      </div>

      <div class="field">
        <label>通知频率<span class="opt">选填</span></label>
        <select name="quiet_min">
          <option value="0" {% if not form.get('quiet_min') %}selected{% endif %}>每次变化都通知</option>
          <option value="30" {% if form.get('quiet_min') == 30 %}selected{% endif %}>最多每 30 分钟一封</option>
          <option value="60" {% if form.get('quiet_min') == 60 %}selected{% endif %}>最多每小时一封</option>
          <option value="360" {% if form.get('quiet_min') == 360 %}selected{% endif %}>最多每 6 小时一封</option>
          <option value="1440" {% if form.get('quiet_min') == 1440 %}selected{% endif %}>最多每天一封</option>
        </select>
        <div class="hint">榜单、天气这类内容变化频繁的站点，调低频率能少收点邮件。要第一时间知道的站点，就用默认。</div>
      </div>

      <div class="actions">
        <button class="btn primary" type="submit">添加</button>
        <a class="cancel" href="/">取消</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
