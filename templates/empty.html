<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ name }} · sitewatch</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  .wrap { max-width: 640px; }

  .back:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">&larr; 返回列表</a>
  <h1>{{ name }}</h1>
  <div class="empty" style="margin-top: var(--s4)">
    {% if exists %}
      这个站点还没有任何快照。点一下「立即抓取一次」就会有。
    {% else %}
      没有叫这个名字的监控项。
    {% endif %}
  </div>
</div>
</body>
</html>
