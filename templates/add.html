<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>添加监控项 · sitewatch</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --line: #e3e6ea;
    --text: #1f2328; --muted: #6b7280;
    --danger: #b42318; --danger-bg: #fdeceb;
    --accent: #1f6feb;
    --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 64px;
    background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  a.back { color: var(--muted); font-size: 12px; text-decoration: none; }
  a.back:hover { color: var(--text); }
  h1 { font-size: 20px; font-weight: 600; margin: 10px 0 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 24px;
  }
  .err {
    background: var(--danger-bg); color: var(--danger);
    border-radius: 8px; padding: 10px 14px; margin-bottom: 18px; font-size: 13px;
  }
  .field { margin-bottom: 20px; }
  .field:last-of-type { margin-bottom: 24px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .req { color: var(--danger); font-weight: 400; margin-left: 2px; }
  .opt { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 4px; }
  input[type="text"] {
    width: 100%; font: inherit; font-family: var(--mono); font-size: 13px;
    padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: #fff; color: var(--text); outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(31,111,235,.12); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .hint code {
    font-family: var(--mono); font-size: 11px;
    background: #eef0f3; border-radius: 3px; padding: 1px 5px;
  }
  .actions { display: flex; gap: 10px; align-items: center; }
  button {
    font: inherit; font-size: 14px; padding: 9px 20px; border-radius: 8px;
    border: 1px solid transparent; background: var(--accent); color: #fff;
    cursor: pointer; font-weight: 500;
  }
  button:hover { background: #1a5fd0; }
  a.cancel { color: var(--muted); font-size: 13px; text-decoration: none; }
  a.cancel:hover { color: var(--text); }
  .guide {
    background: #f8f9fb; border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 16px; margin-bottom: 20px; font-size: 12px; color: var(--muted);
    line-height: 1.7;
  }
  .guide b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">&larr; 返回列表</a>
  <h1>添加监控项</h1>

  <div class="guide">
    <b>下面两个选填项，二选一就够了：</b><br>
    抓普通网页 → 填 <code>选择器</code>；抓数据接口 → 填 <code>字段名</code>。<br>
    不确定填哪个？两个都留空，先看能抓到什么，再回来改。
  </div>

  <div class="card">
    {% if error %}<div class="err">{{ error }}</div>{% endif %}

    <form method="post" action="/add">
      <div class="field">
        <label>名字<span class="req">*</span></label>
        <input type="text" name="name" value="{{ form.get('name','') }}"
               placeholder="自己起一个，比如 fz-weather" autofocus>
        <div class="hint">用来区分不同站点，不能重复。</div>
      </div>

      <div class="field">
        <label>网址<span class="req">*</span></label>
        <input type="text" name="url" value="{{ form.get('url','') }}"
               placeholder="https://...">
        <div class="hint">完整的 URL，要以 <code>http://</code> 或 <code>https://</code> 开头。</div>
      </div>

      <div class="field">
        <label>选择器<span class="opt">选填，抓网页时用</span></label>
        <input type="text" name="selector" value="{{ form.get('selector','') }}"
               placeholder="比如 ul.t li">
        <div class="hint">
          CSS 选择器，只抓页面上这部分内容。留空则抓整页正文（导航、页脚都会混进来）。
        </div>
      </div>

      <div class="field">
        <label>字段名<span class="opt">选填，抓接口时用</span></label>
        <input type="text" name="json_keys" value="{{ form.get('json_keys','') }}"
               placeholder="比如 code,title,bvid">
        <div class="hint">
          逗号分隔。只保留这些字段，噪声会小很多。留空则保存整个 JSON。
        </div>
      </div>

      <div class="actions">
        <button type="submit">添加</button>
        <a class="cancel" href="/">取消</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
